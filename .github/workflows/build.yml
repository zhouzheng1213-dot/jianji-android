name: Build APK

# 源码推上来即自动编译；也可以在 Actions 页面手动触发。
#
# 刻意不做「构建结束后把报告提交回仓库」：那会让 main 每次构建都自己往前跑一格，
# 任何本地克隆都会莫名其妙落后一个提交、下次 push 被拒。
# 构建报告改为打进 Actions 日志 + 随 artifact 一起上传，Release 里另有 SHA256SUMS.txt。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 发布 Release 与回写构建报告都需要写权限
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 不用 ubuntu-latest：它在 2026-10-19 起会迁到 Ubuntu 26，
    # 钉住 24.04 免得某天一次镜像迁移把构建搞挂。
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore binary files from base64
        run: bash scripts/bootstrap-binaries.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 不要用 android-actions/setup-android：
      # GitHub 托管的 runner 镜像里本来就装好了 Android SDK
      # （ANDROID_HOME=/usr/local/lib/android/sdk），那个 action 纯粹是多余的，
      # 而它最新只到 v4、我们原先写的 v3 被强制跑在 Node 24 上会直接失败。
      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::runner 上没有预装的 Android SDK（找的是 $SDK）"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::找不到 sdkmanager"
            exit 1
          fi
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"

          echo "SDK        = $SDK"
          echo "sdkmanager = $SDKMGR"

      - name: Install required SDK packages
        run: |
          set -euo pipefail
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms"  || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

      # 优先用 wrapper（锁定 Gradle 8.8，与本地验证过的版本一致）；
      # 万一 wrapper jar 没还原成功，退回 setup-gradle 提供的 gradle，避免整条流水线挂掉。
      - name: Resolve Gradle command
        run: |
          set -euo pipefail
          chmod +x ./gradlew 2>/dev/null || true
          if [ -x ./gradlew ]; then
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle"   >> "$GITHUB_ENV"
          fi

      - name: Show Gradle version
        run: $GRADLE_CMD --version

      - name: Run unit tests
        run: $GRADLE_CMD :app:testDebugUnitTest --no-daemon --stacktrace

      # lint 会拦住 NewApi 这类「运行期才炸」的问题 —— 本项目 minSdk 26，
      # 而液态玻璃用到的 RuntimeShader 是 API 33 的类，光靠肉眼看守卫很容易漏。
      #
      # 判据读 XML 报告里的 severity="Error"，不读 HTML 里那句 "Lint Report: N error"
      # —— 前者是结构化字段，后者是给人看的显示字符串，措辞一变就失效。
      # 先断言报告文件存在：lint 自己崩了（分析失败）时不会产出报告，
      # 那时候 grep 找不到 Error 反而会「通过」，必须显式挡掉。
      - name: Lint
        run: |
          set -euo pipefail
          $GRADLE_CMD :app:lintDebug --no-daemon --stacktrace
          REPORT=app/build/reports/lint-results-debug.xml
          if [ ! -f "$REPORT" ]; then
            echo "::error::lint 没有产出报告 $REPORT（分析可能中途失败了）"
            exit 1
          fi
          if grep -q 'severity="Error"' "$REPORT"; then
            echo "::error::lint 报告里存在 error 级别问题"
            grep -B2 'severity="Error"' "$REPORT" | head -40 || true
            exit 1
          fi
          echo "OK: lint 无 error"
          grep -o 'severity="[A-Za-z]*"' "$REPORT" | sort | uniq -c || true

      - name: Build debug APK
        run: $GRADLE_CMD :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: $GRADLE_CMD :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs and compute SHA-256
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk      out/JianJi-1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk  out/JianJi-1.0.0-release.apk
          cd out
          sha256sum *.apk | tee SHA256SUMS.txt
          {
            echo 'checksums<<EOF'
            cat SHA256SUMS.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Audit permissions declared in the APK
        run: |
          set -euo pipefail
          AAPT2=$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 | head -1)
          echo "using $AAPT2"
          PERMS=$("$AAPT2" dump permissions out/JianJi-1.0.0-release.apk || true)
          echo "$PERMS"
          if echo "$PERMS" | grep -qE "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)"; then
            echo "::error::APK 里出现了不应存在的网络/存储权限"
            exit 1
          fi
          echo "OK: APK 未申请任何网络或存储读取权限"

      - name: Write build report
        run: |
          set -euo pipefail
          DEBUG_SHA=$(awk '/debug/{print $1}' out/SHA256SUMS.txt)
          RELEASE_SHA=$(awk '/release/{print $1}' out/SHA256SUMS.txt)
          DEBUG_SIZE=$(stat -c%s out/JianJi-1.0.0-debug.apk)
          RELEASE_SIZE=$(stat -c%s out/JianJi-1.0.0-release.apk)
          cat > out/build-report.json <<JSON
          {
            "app": "简记",
            "versionName": "1.0.0",
            "runNumber": "${{ github.run_number }}",
            "runId": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "builtOn": "GitHub Actions / ubuntu-24.04",
            "releaseTag": "build-${{ github.run_number }}",
            "debug": { "file": "JianJi-1.0.0-debug.apk", "sha256": "$DEBUG_SHA", "bytes": $DEBUG_SIZE },
            "release": { "file": "JianJi-1.0.0-release.apk", "sha256": "$RELEASE_SHA", "bytes": $RELEASE_SIZE },
            "networkPermissions": []
          }
          JSON
          cat out/build-report.json

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v6
        with:
          name: JianJi-APK-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_number }}"
          NOTES=$(printf '简记 1.0.0 · 由 GitHub Actions 编译产出\n\n构建于 %s\n\n### SHA-256\n```\n%s\n```\n' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" "${{ steps.collect.outputs.checksums }}")
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 同一个 run 重跑时 tag 已经存在，改成覆盖上传，别让整个 job 折在这一步
            gh release upload "$TAG" \
              out/JianJi-1.0.0-debug.apk \
              out/JianJi-1.0.0-release.apk \
              out/SHA256SUMS.txt \
              out/build-report.json \
              --clobber
          else
            gh release create "$TAG" \
              out/JianJi-1.0.0-debug.apk \
              out/JianJi-1.0.0-release.apk \
              out/SHA256SUMS.txt \
              out/build-report.json \
              --title "简记 1.0.0 · build ${{ github.run_number }}" \
              --notes "$NOTES"
          fi
