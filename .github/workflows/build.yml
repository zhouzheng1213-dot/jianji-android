name: Build APK

# 源码推上来即自动编译；也可以在 Actions 页面手动触发。
# paths-ignore 很关键：构建结束后机器人会把 build-report.json 提交回仓库，
# 不排除它就会形成「提交 -> 触发构建 -> 再提交」的无限循环。
on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'build-report.json'
  workflow_dispatch:

# 发布 Release 与回写构建报告都需要写权限
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore binary files from base64
        run: bash scripts/bootstrap-binaries.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs and compute SHA-256
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk      out/JianJi-1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk  out/JianJi-1.0.0-release.apk
          cd out
          sha256sum *.apk | tee SHA256SUMS.txt
          {
            echo 'checksums<<EOF'
            cat SHA256SUMS.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Audit permissions declared in the APK
        run: |
          set -euo pipefail
          AAPT2=$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 | head -1)
          echo "using $AAPT2"
          PERMS=$("$AAPT2" dump permissions out/JianJi-1.0.0-release.apk || true)
          echo "$PERMS"
          if echo "$PERMS" | grep -qE "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|READ_MEDIA_IMAGES|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)"; then
            echo "::error::APK 里出现了不应存在的网络/存储权限"
            exit 1
          fi
          echo "OK: APK 未申请任何网络或存储读取权限"

      - name: Write build report
        run: |
          set -euo pipefail
          DEBUG_SHA=$(awk '/debug/{print $1}' out/SHA256SUMS.txt)
          RELEASE_SHA=$(awk '/release/{print $1}' out/SHA256SUMS.txt)
          DEBUG_SIZE=$(stat -c%s out/JianJi-1.0.0-debug.apk)
          RELEASE_SIZE=$(stat -c%s out/JianJi-1.0.0-release.apk)
          cat > build-report.json <<JSON
          {
            "app": "简记",
            "versionName": "1.0.0",
            "runNumber": "${{ github.run_number }}",
            "runId": "${{ github.run_id }}",
            "commit": "${{ github.sha }}",
            "builtAt": "$(date -u '+%Y-%m-%dT%H:%M:%SZ')",
            "builtOn": "GitHub Actions / ubuntu-latest",
            "releaseTag": "build-${{ github.run_number }}",
            "debug": { "file": "JianJi-1.0.0-debug.apk", "sha256": "$DEBUG_SHA", "bytes": $DEBUG_SIZE },
            "release": { "file": "JianJi-1.0.0-release.apk", "sha256": "$RELEASE_SHA", "bytes": $RELEASE_SIZE },
            "networkPermissions": []
          }
          JSON
          cat build-report.json

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JianJi-APK-${{ github.run_number }}
          path: out/*
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NOTES=$(printf '简记 1.0.0 · 由 GitHub Actions 编译产出\n\n构建于 %s\n\n### SHA-256\n```\n%s\n```\n' \
            "$(date -u '+%Y-%m-%d %H:%M UTC')" "${{ steps.collect.outputs.checksums }}")
          gh release create "build-${{ github.run_number }}" \
            out/JianJi-1.0.0-debug.apk \
            out/JianJi-1.0.0-release.apk \
            out/SHA256SUMS.txt \
            --title "简记 1.0.0 · build ${{ github.run_number }}" \
            --notes "$NOTES"

      - name: Commit build report back to the repository
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report.json
          git commit -m "ci: build report for run ${{ github.run_number }}"
          git push
